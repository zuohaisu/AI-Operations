# Ticket Autopilot Engine — "Hermes-as-driver" variant of ticket-pipeline.
#
# Same deterministic loop as ticket-pipeline.yaml (plan -> execute -> verify
# -> [reject: re-run execute] / [accept: close]). The ONLY difference: the
# three reasoning nodes run as *Hermes sub-agents* (driver: hermes) instead of
# a bare LLM or the `claude` CLI. Ticket Autopilot Engine still owns the control flow, the retry
# cap, the snapshot, and the strict guardrails; Hermes owns execution.
#
# Real run needs a Hermes gateway listening at HERMES_API_URL
# (default http://localhost:8642/v1) + HERMES_API_KEY (optional). Headless
# self-test: `ticket_autopilot.engine run workflows/ticket-pipeline-hermes.yaml --mock`.

version: "1.0"
name: ticket-pipeline-hermes

vars:
  max_retries: 5          # QA retry cap. User: real manual max seen = 7;
                          # use 5; usually passes in 1-2 retries.
  ticket_context: ""      # stub — AIO-8 connector fills this from the Plane ticket

agents:
  planner:
    driver: hermes
    system: |
      You are the Planner. Read the ticket and write a concise implementation
      plan (what to change, which files, how to verify). You may use your
      tools and delegate research if needed.

  executor:
    driver: hermes
    system: |
      You are the Executor. Implement the plan. You operate inside a strict
      sandbox (read-only, designated directory) enforced by the caller.

  verifier:
    driver: script
    entry: qa                      # independent QA stays outside the hermes
                                   # backend: handlers/qa.py -> connectors/qa.py
                                   # (qodercli read-only + qa-verdict schema gate)

  closer:
    driver: script
    entry: close_ticket            # handlers/close_ticket.py::close_ticket

params:
  ticket_id:
    type: string
    description: Plane ticket UUID to process

nodes:
  - id: plan
    agent: planner
    capture: plan
    inputs:
      ticket_id: ${params.ticket_id}

  - id: execute
    agent: executor
    capture: result
    inputs:
      plan: ${nodes.plan}

  - id: verify
    agent: verifier
    capture: verdict
    inputs:
      plan: ${nodes.plan}
      result: ${nodes.execute}
      ticket_context: ${vars.ticket_context}

  - id: close
    agent: closer
    capture: done
    inputs:
      ticket_id: ${params.ticket_id}
      plan: ${nodes.plan}
      result: ${nodes.execute}

edges:
  - from: plan
    to: execute
  - from: execute
    to: verify
  - from: verify
    to: execute
    kind: loop
    when: "nodes.verify.decision == 'reject'"
    max_retries: ${vars.max_retries}
  - from: verify
    to: close
    when: "nodes.verify.decision == 'accept'"

# Headless self-test values (used with --mock; no gateway/Plane calls).
# verifier rejects twice, then accepts -> exercises the loop exactly.
mock:
  planner:  {returns: "Mock plan for ${params.ticket_id}"}
  executor: {returns: "Mock implementation of the plan."}
  verifier: {reject_times: 2, reject_reason: "needs more tests",
             accept_reason: "plan satisfied"}
  closer:   {returns: {closed: true}}
