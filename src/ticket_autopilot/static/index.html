<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ticket Autopilot</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
  <header><h1>Ticket Autopilot</h1><p class="lede">Artifact-backed local ticket delivery evidence.</p></header>
  <section aria-labelledby="tickets-heading"><div class="section-head"><h2 id="tickets-heading">Open Plane tickets</h2><button id="refresh" type="button">Refresh</button></div><output id="tickets-status" aria-live="polite"></output><div id="tickets" class="ticket-list"></div></section>
  <section id="detail" hidden aria-labelledby="detail-heading"><h2 id="detail-heading">Ticket preparation</h2><div id="detail-body"></div><button id="run" type="button">Run Ticket Autopilot</button><button id="prepare" type="button">Prepare prompts only (advanced)</button><output id="prepare-result" aria-live="polite"></output></section>
  <section id="timeline" hidden aria-labelledby="timeline-heading"><div class="section-head"><h2 id="timeline-heading">Run Timeline</h2><output id="run-status" aria-live="polite"></output></div><p id="run-summary"></p><div id="hard-break" hidden></div><div id="timeline-events" class="timeline-events"></div><div class="controls"><button id="retry" type="button">Retry current stage</button><button id="stop" type="button">Stop owned Run</button><button id="finder" type="button">Reveal worktree path</button></div><details><summary>Record repository-owner action</summary><form id="owner-action"><label>Action <select name="action"><option value="visual_accept">Accept visual review</option><option value="override_gate">Override gate</option><option value="push_feature_branch">Authorize feature-branch push</option><option value="create_draft_pr">Create Draft PR</option><option value="merge">Authorize merge</option></select></label><label>Actor <input name="actor" required autocomplete="name"></label><label>Reason <input name="reason" required></label><button type="submit">Record owner action</button><output id="owner-action-result" aria-live="polite"></output></form></details></section>
  <details><summary>Local settings</summary><form id="settings"><fieldset><legend>Plane</legend><label>Workspace <input name="workspace" autocomplete="off"></label><label>Project <input name="project" autocomplete="off"></label><label>API key <input name="api_key" type="password" autocomplete="off" placeholder="Not configured"></label></fieldset><fieldset><legend>Local repository</legend><label>Repository <input name="repository" autocomplete="off"></label></fieldset><fieldset><legend>Agent CLIs</legend><div class="agent-cards"><div class="agent-card"><h3>Planner</h3><label>Agent <select name="planner-provider"></select></label><label>Model <select name="planner-model"></select></label><label>Reasoning <select name="planner-reasoning"></select></label><label>Permission mode <select name="planner-permission_mode"></select></label><p class="agent-status" id="planner-agent-status" aria-live="polite"></p></div><div class="agent-card"><h3>Developer</h3><label>Agent <select name="developer-provider"></select></label><label>Model <select name="developer-model"></select></label><label>Reasoning <select name="developer-reasoning"></select></label><label>Permission mode <select name="developer-permission_mode"></select></label><p class="agent-status" id="developer-agent-status" aria-live="polite"></p></div><div class="agent-card"><h3>QA</h3><label>Agent <select name="qa-provider"></select></label><label>Model <select name="qa-model"></select></label><label>Reasoning <select name="qa-reasoning"></select></label><label>Permission mode <select name="qa-permission_mode"></select></label><p class="agent-status" id="qa-agent-status" aria-live="polite"></p></div></div></fieldset><button type="submit">Save settings</button><output id="settings-result" aria-live="polite"></output></form></details>
</main><script src="/app.js"></script></body></html>
