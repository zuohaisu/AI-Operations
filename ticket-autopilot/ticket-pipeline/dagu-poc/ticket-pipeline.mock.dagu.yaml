# ticket-pipeline.mock.dagu.yaml — MOCK version (headless PoC)
# Same DAG shape as the full version, but with NO blocking approval step, so it
# runs end-to-end non-interactively. plan/execute/verify are canned (no LLM or
# claude key required); only `close` + `cleanup` hit the real Plane API through
# plane_client, exercising Dagu's DAG ordering + artifact + integration path.
params:
  - name: TICKET_ID
    type: string
    description: Plane ticket ID to process. If empty, a test ticket is created.
working_dir: /Users/hzuo/Documents/code/AI-Operations/tooling/ticket-pipeline/dagu-poc
steps:
  - id: ensure_ticket
    run: python3 ensure_ticket.py

  - id: plan
    depends: ensure_ticket
    run: python3 plan.py
    stdout:
      artifact: plan.md

  - id: execute
    depends: plan
    run: python3 execute.py
    stdout:
      artifact: result.md

  - id: verify
    depends: execute
    run: python3 verify.py
    stdout:
      artifact: verify.json

  - id: close
    depends: verify
    run: python3 close.py

  - id: cleanup
    depends: close
    run: python3 cleanup.py
